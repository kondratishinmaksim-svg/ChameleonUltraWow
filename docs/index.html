<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chameleon Ultra — LED Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Flex:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-secondary: #7cacf8;
      --md-sys-color-surface: #111318;
      --md-sys-color-surface-dim: #111318;
      --md-sys-color-surface-container-lowest: #0c0e12;
      --md-sys-color-surface-container-low: #191c20;
      --md-sys-color-surface-container: #1d2024;
      --md-sys-color-surface-container-high: #272a2f;
      --md-sys-color-surface-container-highest: #32353a;
      --md-sys-color-on-surface: #e2e2e6;
      --md-sys-color-on-surface-variant: #c4c6cf;
      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #44474e;
      --md-sys-color-tertiary: #b4c5ff;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-success: #6dd58c;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans Flex', 'Google Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 12px 110px;
    }

    .app-shell {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* TOP APP BAR - MATERIAL 3 EXPRESSIVE */
    .app-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--radius-lg);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .app-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0842a0, #7cacf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(8, 66, 160, 0.4);
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .app-subtitle {
      font-size: 0.8rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .status-badge.online {
      background: rgba(109, 213, 140, 0.15);
      border-color: var(--md-sys-color-success);
      color: var(--md-sys-color-success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--md-sys-color-outline);
    }

    .status-badge.online .status-dot {
      background: var(--md-sys-color-success);
      box-shadow: 0 0 8px var(--md-sys-color-success);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    /* HARDWARE VISUALIZER CARD */
    .hardware-card {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .hardware-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .chameleon-device-body {
      width: 100%;
      background: #080a0f;
      border: 2px solid #232730;
      border-radius: 36px;
      padding: 16px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.9), 0 8px 24px rgba(0,0,0,0.5);
    }

    .hw-led {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #191c24;
      border: 1px solid #2d3340;
      transition: all 0.12s ease;
      position: relative;
    }

    .hw-led.active {
      box-shadow: 0 0 16px 4px currentColor;
    }

    /* SLOT CHIPS */
    .slots-scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      width: 100%;
      scrollbar-width: none;
    }
    .slots-scroll-row::-webkit-scrollbar { display: none; }

    .slot-chip {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .slot-chip:active { transform: scale(0.95); }

    .slot-chip.selected {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }

    /* SEGMENTED TAB BUTTONS */
    .segmented-bar {
      display: flex;
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-full);
      padding: 4px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .segmented-bar::-webkit-scrollbar { display: none; }

    .segmented-btn {
      flex: 1 0 auto;
      padding: 10px 12px;
      border-radius: var(--radius-full);
      background: transparent;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      white-space: nowrap;
    }

    .segmented-btn.active {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 2px 10px rgba(168, 199, 250, 0.3);
    }

    /* EXPRESSIVE CONTAINER CARDS */
    .expressive-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* EFFECT CHIPS GRID */
    .effect-chips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .effect-item {
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .effect-item:active { transform: scale(0.96); }

    .effect-item.selected {
      background: rgba(168, 199, 250, 0.16);
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 16px rgba(168, 199, 250, 0.25);
    }

    .effect-icon-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .effect-desc {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.25;
    }

    /* COLOR PALETTE ROW */
    .colors-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }

    .color-swatch {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid transparent;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .color-swatch:active { transform: scale(0.9); }

    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 14px currentColor;
    }

    .color-swatch.selected::after {
      content: "✓";
      color: #000;
      font-weight: 800;
      font-size: 16px;
    }

    /* M3 SLIDER */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    .slider-info span:last-child {
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 16px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-surface-container-highest);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--md-sys-color-primary);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      border: 3px solid var(--md-sys-color-on-primary);
    }

    /* POWER TOGGLE ROW */
    .power-dual-row {
      display: flex;
      gap: 12px;
      background: var(--md-sys-color-surface-container-high);
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .power-dual-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .power-dual-col label {
      font-size: 0.8rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 600;
    }
    .power-dual-col select {
      background: var(--md-sys-color-surface-container-highest);
      color: #fff;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
    }

    /* BOTTOM FLOATING ACTION BAR */
    .action-bar-bottom {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 520px;
      background: rgba(29, 32, 36, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-full);
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100;
    }

    .m3-btn {
      flex: 1;
      height: 48px;
      border-radius: var(--radius-full);
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .m3-btn:active { transform: scale(0.96); }

    .m3-btn-tonal {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }

    .m3-btn-primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 4px 14px rgba(168, 199, 250, 0.35);
    }

    /* TOAST NOTIFICATION */
    .toast-pill {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border: 1px solid var(--md-sys-color-primary);
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .toast-pill.visible {
      transform: translateX(-50%) translateY(0);
    }

    .toast-pill.error {
      background: rgba(255, 180, 171, 0.2);
      border-color: var(--md-sys-color-error);
      color: var(--md-sys-color-error);
    }

    /* TERMINAL CONSOLE */
    .console-card {
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--md-sys-color-outline);
      font-family: 'Roboto Mono', monospace;
      text-transform: uppercase;
    }

    .console-body {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div id="toastPill" class="toast-pill">✅ Сохранено</div>

<div class="app-shell">
  <!-- TOP APP BAR -->
  <header class="app-bar">
    <div class="app-title-group">
      <div class="app-icon">🦎</div>
      <div>
        <div class="app-title">Chameleon Ultra</div>
        <div class="app-subtitle" id="deviceSubText">LED Studio • M3 Expressive</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Офлайн</span>
    </div>
  </header>

  <!-- CONNECTION ROW -->
  <div style="display: flex; gap: 10px;">
    <button class="m3-btn m3-btn-primary" id="btnBleConnect" onclick="handleConnectBLE()">
      ⚡ Подключить Bluetooth
    </button>
    <button class="m3-btn m3-btn-tonal" id="btnUsbConnect" onclick="handleConnectUSB()">
      🔌 USB
    </button>
  </div>

  <!-- HARDWARE VISUALIZER CARD -->
  <div class="hardware-card">
    <div class="hardware-header">
      <span>Индикатор светодиодов</span>
      <span id="batteryLabel">Батарея: —</span>
    </div>

    <div class="chameleon-device-body">
      <div class="hw-led" id="hwLed0"></div>
      <div class="hw-led" id="hwLed1"></div>
      <div class="hw-led" id="hwLed2"></div>
      <div class="hw-led" id="hwLed3"></div>
      <div class="hw-led" id="hwLed4"></div>
      <div class="hw-led" id="hwLed5"></div>
      <div class="hw-led" id="hwLed6"></div>
      <div class="hw-led" id="hwLed7"></div>
    </div>

    <!-- ACTIVE SLOT SELECTOR -->
    <div class="slots-scroll-row" id="slotsRow">
      <!-- Generated 8 slot chips -->
    </div>
  </div>

  <!-- SEGMENTED TABS (4 TABS) -->
  <div class="segmented-bar">
    <button class="segmented-btn active" id="tabConnect" onclick="switchSection('connect')">
      💓 Касание
    </button>
    <button class="segmented-btn" id="tabIdle" onclick="switchSection('idle')">
      💤 В покое
    </button>
    <button class="segmented-btn" id="tabDisconnect" onclick="switchSection('disconnect')">
      👋 Убирание
    </button>
    <button class="segmented-btn" id="tabPower" onclick="switchSection('power')">
      ⚡ Вкл / Выкл
    </button>
  </div>

  <!-- CONFIGURATION CARD -->
  <div class="expressive-card">
    <div class="card-heading" id="sectionHeading">
      💓 Эффект при касании считывателя
    </div>

    <!-- POWER EXTRA CONTROLS (ONLY IN POWER TAB) -->
    <div id="powerControlsRow" class="power-dual-row" style="display: none;">
      <div class="power-dual-col">
        <label>⚡ При включении:</label>
        <select id="powerOnSelect" onchange="onPowerSelectChange()"></select>
      </div>
      <div class="power-dual-col">
        <label>🌙 При выключении:</label>
        <select id="powerOffSelect" onchange="onPowerSelectChange()"></select>
      </div>
    </div>

    <!-- EFFECT GRID (FOR CONNECT / IDLE / DISCONNECT) -->
    <div class="effect-chips-grid" id="effectGrid"></div>

    <!-- COLOR SELECTION -->
    <div class="slider-container">
      <div class="slider-info">
        <span>Цвет эффекта</span>
        <span id="selectedColorName">Белый</span>
      </div>
      <div class="colors-row" id="colorPalette"></div>
    </div>

    <!-- SPEED SLIDER -->
    <div class="slider-container" id="speedContainer">
      <div class="slider-info">
        <span>Скорость анимации</span>
        <span id="speedVal">7</span>
      </div>
      <input type="range" id="speedSlider" min="1" max="10" value="7" oninput="onSpeedInput(this.value)">
    </div>
  </div>

  <!-- TERMINAL LOG -->
  <div class="console-card">
    <div class="console-header">
      <span>BLE / USB Log</span>
      <span style="cursor: pointer" onclick="clearLog()">[Очистить]</span>
    </div>
    <div class="console-body" id="logBox">Chameleon Ultra LED Studio готова. Включите Bluetooth и нажмите "Подключить Bluetooth".</div>
  </div>
</div>

<!-- FLOATING BOTTOM BAR -->
<div class="action-bar-bottom">
  <button class="m3-btn m3-btn-tonal" onclick="testCurrentEffect()">
    ▶ Тест сейчас
  </button>
  <button class="m3-btn m3-btn-primary" onclick="saveToDeviceFlash()">
    💾 Записать во Flash
  </button>
</div>

<script>
/**
 * CONSTANTS & BLE PROTOCOL
 */
const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

const CMD = {
  GET_BATTERY_INFO:       1025,
  GET_ACTIVE_SLOT:        1018,
  SET_ACTIVE_SLOT:        1003,
  GET_CUSTOM_ANIM_CONFIG: 1100,
  SET_CUSTOM_ANIM_CONFIG: 1101,
  TRIGGER_TEST_ANIM:      1102
};

const EFFECTS = [
  { id: 10, name: "Пульсация", icon: "💓", desc: "Мягкая пульсация светом" },
  { id: 15, name: "Огонёк", icon: "🔴", desc: "Бегущий огонь Knight Rider" },
  { id: 12, name: "Волна", icon: "🌊", desc: "Плавная волна туда-обратно" },
  { id: 13, name: "Дыхание", icon: "😮‍💨", desc: "Плавное нарастание и затухание" },
  { id: 14, name: "Радуга", icon: "🌈", desc: "Перелив всех цветов спектра" },
  { id: 24, name: "Киберпанк", icon: "⚡", desc: "Неоновый дуэт Magenta + Cyan" },
  { id: 25, name: "Радар", icon: "🎯", desc: "Встречные лучи сходятся в центр" },
  { id: 26, name: "Аврора", icon: "🌌", desc: "Северное сияние Green-Cyan-Blue" },
  { id: 27, name: "Глитч", icon: "👾", desc: "Хакерские рваные всполохи" },
  { id: 28, name: "Гиперлуп", icon: "🚀", desc: "Разгон с яркой белой вспышкой" },
  { id: 29, name: "Комета", icon: "☄️", desc: "Ядро с затухающим хвостом" },
  { id: 21, name: "Полиция", icon: "🚨", desc: "Красно-синий проблесковый маяк" },

/**
 * BLE CLASS
 */
class ChameleonBLE {
  constructor() {
    this.device = null;
    this.server = null;
    this.rxChar = null;
    this.txChar = null;
    this.rxBuffer = [];
    this.pending = new Map();
    this.isConnected = false;
  }

  buildFrame(cmd, data = []) {
    const SOF = 0x11;
    const LRC1 = (0x100 - SOF) & 0xff;
    const len = data.length;
    const header = [
      SOF, LRC1,
      (cmd >> 8) & 0xff, cmd & 0xff,
      0x00, 0x00,
      (len >> 8) & 0xff, len & 0xff
    ];
    let sumHead = header.reduce((a, b) => a + b, 0);
    const LRC2 = (0x100 - (sumHead & 0xff)) & 0xff;
    let frame = [...header, LRC2, ...data];
    let sumData = data.reduce((a, b) => a + b, 0);
    const LRC3 = len > 0 ? ((0x100 - (sumData & 0xff)) & 0xff) : 0x00;
    frame.push(LRC3);
    return new Uint8Array(frame);
  }

  async connect() {
    log("Запрос Bluetooth устройства...");
    this.device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [NUS_SERVICE_UUID]
    });

    this.device.addEventListener('gattserverdisconnected', () => this.onDisconnected());
    log(`Подключение к ${this.device.name || "Chameleon Ultra"}...`);
    this.server = await this.device.gatt.connect();
    const service = await this.server.getPrimaryService(NUS_SERVICE_UUID);
    this.rxChar = await service.getCharacteristic(NUS_RX_UUID);
    this.txChar = await service.getCharacteristic(NUS_TX_UUID);

    await this.txChar.startNotifications();
    this.txChar.addEventListener('characteristicvaluechanged', (e) => this.onNotification(e));

    this.isConnected = true;
    activeTransport = this;
    setOnlineUI(true, this.device.name || "Chameleon Ultra");
    log("✅ Bluetooth успешно подключен!");
    showToast("✅ Bluetooth подключен!");
    await onDeviceReady();
  }

  onDisconnected() {
    this.isConnected = false;
    this.rxChar = null;
    this.txChar = null;
    setOnlineUI(false);
    log("⚠️ Устройство отключено.");
    showToast("⚠️ Устройство отключено", true);
  }

  async send(cmd, data = [], timeoutMs = 3000) {
    if (!this.isConnected || !this.rxChar) throw new Error("Bluetooth не подключен!");
    const frame = this.buildFrame(cmd, data);
    return new Promise(async (resolve, reject) => {
      const timer = setTimeout(() => {
        this.pending.delete(cmd);
        resolve({ cmd, data: [] });
      }, timeoutMs);

      this.pending.set(cmd, (resp) => {
        clearTimeout(timer);
        resolve(resp);
      });

      try {
        const CHUNK = 20;
        for (let i = 0; i < frame.length; i += CHUNK) {
          await this.rxChar.writeValue(frame.slice(i, i + CHUNK));
        }
      } catch (err) {
        clearTimeout(timer);
        this.pending.delete(cmd);
        reject(err);
      }
    });
  }

  onNotification(e) {
    const arr = new Uint8Array(e.target.value.buffer);
    for (let b of arr) this.rxBuffer.push(b);
    while (this.rxBuffer.length >= 10) {
      if (this.rxBuffer[0] !== 0x11) { this.rxBuffer.shift(); continue; }
      const cmd = (this.rxBuffer[2] << 8) | this.rxBuffer[3];
      const dataLen = (this.rxBuffer[6] << 8) | this.rxBuffer[7];
      const total = 10 + dataLen;
      if (this.rxBuffer.length < total) return;
      const frame = this.rxBuffer.slice(0, total);
      this.rxBuffer = this.rxBuffer.slice(total);
      const payload = frame.slice(9, 9 + dataLen);
      const cb = this.pending.get(cmd);
      if (cb) {
        this.pending.delete(cmd);
        cb({ cmd, data: payload });
      }
    }
  }
}

/**
 * USB SERIAL CLASS
 */
class ChameleonUSB {
  constructor() {
    this.port = null;
    this.reader = null;
    this.writer = null;
    this.rxBuffer = [];
    this.pending = new Map();
    this.isConnected = false;
    this.reading = false;
  }

  async connect() {
    if (!("serial" in navigator)) throw new Error("Web Serial не поддерживается вашим браузером");
    this.port = await navigator.serial.requestPort();
    await this.port.open({ baudRate: 115200 });
    this.isConnected = true;
    this.reading = true;
    activeTransport = this;
    this.writer = this.port.writable.getWriter();
    this.readLoop();
    setOnlineUI(true, "USB Serial");
    log("✅ USB подключен!");
    showToast("✅ USB подключен!");
    await onDeviceReady();
  }

  async readLoop() {
    this.reader = this.port.readable.getReader();
    try {
      while (this.reading) {
        const { value, done } = await this.reader.read();
        if (done) break;
        if (value) {
          for (let b of value) this.rxBuffer.push(b);
          this.processBuffer();
        }
      }
    } catch(e){}
  }

  processBuffer() {
    while (this.rxBuffer.length >= 10) {
      if (this.rxBuffer[0] !== 0x11) { this.rxBuffer.shift(); continue; }
      const cmd = (this.rxBuffer[2] << 8) | this.rxBuffer[3];
      const dataLen = (this.rxBuffer[6] << 8) | this.rxBuffer[7];
      const total = 10 + dataLen;
      if (this.rxBuffer.length < total) return;
      const frame = this.rxBuffer.slice(0, total);
      this.rxBuffer = this.rxBuffer.slice(total);
      const payload = frame.slice(9, 9 + dataLen);
      const cb = this.pending.get(cmd);
      if (cb) { this.pending.delete(cmd); cb({ cmd, data: payload }); }
    }
  }

  async send(cmd, data = [], timeoutMs = 3000) {
    if (!this.isConnected || !this.writer) throw new Error("USB не подключен!");
    const frame = ble.buildFrame(cmd, data);
    return new Promise(async (resolve, reject) => {
      const timer = setTimeout(() => { this.pending.delete(cmd); resolve({ cmd, data: [] }); }, timeoutMs);
      this.pending.set(cmd, (resp) => { clearTimeout(timer); resolve(resp); });
      try { await this.writer.write(frame); } catch(err) { clearTimeout(timer); this.pending.delete(cmd); reject(err); }
    });
  }
}

const ble = new ChameleonBLE();
const usb = new ChameleonUSB();
let activeTransport = ble;

function isConnected() {
  return (ble && ble.isConnected) || (usb && usb.isConnected);
}

async function sendCmd(cmd, data = []) {
  if (!activeTransport || !activeTransport.isConnected) throw new Error("Устройство не подключено!");
  return await activeTransport.send(cmd, data);
}

}

function setOnlineUI(online, name = "") {
  const badge = document.getElementById("statusBadge");

  if (online) {
    badge.className = "status-badge online";

    sub.innerText = name || "Chameleon Ultra";
  } else {
    badge.className = "status-badge";
    txt.innerText = "Офлайн";
    sub.innerText = "LED Studio • M3 Expressive";
    document.getElementById("batteryLabel").innerText = "Батарея: —";
  }

async function onDeviceReady() {
  try {
    const batt = await sendCmd(CMD.GET_BATTERY_INFO);
    if (batt.data && batt.data.length >= 3) {
      const mv = (batt.data[0] << 8) | batt.data[1];
      const pct = batt.data[2];
      document.getElementById("batteryLabel").innerText = `Батарея: ${pct}% (${mv}mV)`;
    }
  } catch(e){}

  try {
    const s = await sendCmd(CMD.GET_ACTIVE_SLOT);
    if (s.data && s.data.length >= 1) selectSlotUI(s.data[0]);
  } catch(e){}

  try {
    const resp = await sendCmd(CMD.GET_CUSTOM_ANIM_CONFIG);
    if (resp.data && resp.data.length >= 9) {
      state.connect.effect    = resp.data[0];
      state.connect.color     = resp.data[1];
      state.connect.speed     = resp.data[2];
      state.disconnect.effect = resp.data[3];
      state.disconnect.color  = resp.data[4];
      state.disconnect.speed  = resp.data[5];
      state.idle.effect       = resp.data[6];
      state.idle.color        = resp.data[7];
      state.idle.speed        = resp.data[8];
      if (resp.data.length >= 12) {
        state.power.onEffect  = resp.data[9];
        state.power.offEffect = resp.data[10];
        state.power.color     = resp.data[11];
      }
      renderCurrentSectionUI();
      log("✅ Настройки успешно загружены из Chameleon Ultra Flash!");
    }
  } catch(e){
    log("Конфигурация инициализирована по умолчанию.");
  }
}

    opt2.innerText = `${eff.icon} ${eff.name}`;

function switchSection(sec) {
  currentSection = sec;
  document.querySelectorAll(".segmented-btn").forEach(b => b.classList.remove("active"));
  if (sec === 'connect') document.getElementById("tabConnect").classList.add("active");
  if (sec === 'idle') document.getElementById("tabIdle").classList.add("active");
  if (sec === 'disconnect') document.getElementById("tabDisconnect").classList.add("active");
  if (sec === 'power') document.getElementById("tabPower").classList.add("active");

  const heading = document.getElementById("sectionHeading");
  const pRow = document.getElementById("powerControlsRow");
  const effGrid = document.getElementById("effectGrid");
  const spdCont = document.getElementById("speedContainer");

  if (sec === 'connect') {
    heading.innerText = "💓 Эффект при касании считывателя";
    pRow.style.display = "none";
    effGrid.style.display = "grid";
    spdCont.style.display = "flex";
  } else if (sec === 'idle') {
    heading.innerText = "💤 Фоновый эффект в покое";
    pRow.style.display = "none";
    effGrid.style.display = "grid";
    spdCont.style.display = "flex";
  } else if (sec === 'disconnect') {
    heading.innerText = "👋 Эффект при убирании карты";
    pRow.style.display = "none";
    effGrid.style.display = "grid";
    spdCont.style.display = "flex";
  } else if (sec === 'power') {
    heading.innerText = "⚡ Анимации включения и выключения";
    pRow.style.display = "flex";
    effGrid.style.display = "none";
    spdCont.style.display = "none";
  }

  renderCurrentSectionUI();
}

function renderCurrentSectionUI() {
  if (currentSection === 'power') {
    document.querySelectorAll(".color-swatch").forEach(c => c.classList.remove("selected"));
    const swatch = document.getElementById(`colorSwatch_${state.power.color}`);
    if (swatch) swatch.classList.add("selected");
    const colObj = COLORS.find(c => c.id === state.power.color);
    if (colObj) document.getElementById("selectedColorName").innerText = colObj.name;
    document.getElementById("powerOnSelect").value = state.power.onEffect;
    document.getElementById("powerOffSelect").value = state.power.offEffect;
    triggerSimAnimation(state.power.onEffect, state.power.color, 7);
    return;
  }

  const current = state[currentSection];
  document.querySelectorAll(".effect-item").forEach(c => c.classList.remove("selected"));
  const card = document.getElementById(`effCard_${current.effect}`);
  if (card) card.classList.add("selected");

  document.querySelectorAll(".color-swatch").forEach(c => c.classList.remove("selected"));
  const swatch = document.getElementById(`colorSwatch_${current.color}`);
  if (swatch) swatch.classList.add("selected");

  const colObj = COLORS.find(c => c.id === current.color);
  if (colObj) document.getElementById("selectedColorName").innerText = colObj.name;

  document.getElementById("speedSlider").value = current.speed;
  document.getElementById("speedVal").innerText = current.speed;

  triggerSimAnimation(current.effect, current.color, current.speed);
}

function onSelectEffect(effId) {
  if (currentSection !== 'power') {
    state[currentSection].effect = effId;
    renderCurrentSectionUI();

}

function onSelectColor(colId) {
  if (currentSection === 'power') {

}

/**
 * HARDWARE SIMULATOR WITH ALL 21 EFFECTS
 */
let simTimer = null;
function setHwLed(idx, hex, opacity = 1) {
  const el = document.getElementById(`hwLed${idx}`);
  if (!el) return;
  if (hex) {
    el.style.backgroundColor = hex;
    el.style.color = hex;
    el.style.opacity = opacity;
    el.classList.add("active");
  } else {
    el.style.backgroundColor = "#191c24";
    el.style.opacity = 0.25;
    el.classList.remove("active");
  }
}

function clearAllHwLeds() {
  for (let i = 0; i < 8; i++) setHwLed(i, null);
}

function triggerSimAnimation(effect, colorId, speed) {
  if (simTimer) clearInterval(simTimer);
  clearAllHwLeds();
  const found = COLORS.find(c => c.id === colorId);
  const hex = found ? found.hex : "#ffffff";
  let step = 0;
  const interval = Math.max(30, 130 - speed * 10);

  simTimer = setInterval(() => {
    step++;
    if (effect === 10 || effect === 11 || effect === 13) {
      // Pulse / Breathe
      const cycle = (step % 30) / 30;
      const b = Math.sin(cycle * Math.PI);
      for (let i = 0; i < 8; i++) setHwLed(i, hex, Math.max(0.1, b));
    } else if (effect === 15) {
      // Slot chase
      clearAllHwLeds();
      const p = step % 14;
      const idx = p < 8 ? p : 14 - p;
      setHwLed(idx, hex, 1);
    } else if (effect === 12) {
      // Wave
      clearAllHwLeds();
      const p = step % 16;
      const idx = p < 8 ? p : 15 - p;
      setHwLed(idx, hex, 1);
      if (idx > 0) setHwLed(idx - 1, hex, 0.4);
      if (idx < 7) setHwLed(idx + 1, hex, 0.4);
    } else if (effect === 14) {
      // Rainbow
      const rCols = ["#ff3b30", "#ffcc00", "#00ff87", "#00f2fe", "#007aff", "#af52de", "#ffffff"];
      const c = rCols[step % rCols.length];
      for (let i = 0; i < 8; i++) setHwLed(i, c, 1);
    } else if (effect === 24) {
      // Cyberpunk (Magenta + Cyan)
      clearAllHwLeds();
      if ((step % 4) < 2) {
        for (let i = 0; i < 8; i += 2) setHwLed(i, "#af52de", 1);
      } else {
        for (let i = 1; i < 8; i += 2) setHwLed(i, "#00f2fe", 1);
      }
    } else if (effect === 25) {
      // Radar (Beams meeting at center)
      clearAllHwLeds();
      const p = step % 6;
      if (p < 4) {
        setHwLed(p, hex, 1);
        setHwLed(7 - p, hex, 1);
      } else {
        setHwLed(3, "#ffffff", 1);
        setHwLed(4, "#ffffff", 1);
      }
    } else if (effect === 26) {
      // Aurora (shifting gradient)
      clearAllHwLeds();
      const aCols = ["#00ff87", "#00f2fe", "#007aff", "#af52de"];
      const p = step % 8;
      setHwLed(p, aCols[(step / 4) % 4 | 0], 1);
      if (p > 0) setHwLed(p - 1, aCols[((step / 4) + 1) % 4 | 0], 0.5);
    } else if (effect === 27) {
      // Chaos glitch
      clearAllHwLeds();
      if (Math.random() > 0.3) {
        const gCols = ["#00f2fe", "#ffffff", "#af52de", "#ff3b30"];
        setHwLed(Math.floor(Math.random() * 8), gCols[Math.floor(Math.random() * 4)], 1);
      }
    } else if (effect === 28) {
      // Hyperspace
      clearAllHwLeds();
      const round = step % 12;
      if (round < 10) {
        const p = round % 4;
        setHwLed(3 - p, hex, 1);
        setHwLed(4 + p, hex, 1);
      } else {
        for (let i = 0; i < 8; i++) setHwLed(i, "#ffffff", 1);
      }
    } else if (effect === 29) {
      // Comet tail
      clearAllHwLeds();
      const p = step % 10;
      if (p < 8) setHwLed(p, hex, 1);
      if (p > 0 && p - 1 < 8) setHwLed(p - 1, hex, 0.5);
      if (p > 1 && p - 2 < 8) setHwLed(p - 2, hex, 0.2);
    } else if (effect === 21) {
      // Police
      clearAllHwLeds();
      if ((step % 6) < 3) for (let i = 0; i < 4; i++) setHwLed(i, "#ff3b30", 1);
      else for (let i = 4; i < 8; i++) setHwLed(i, "#007aff", 1);
    } else if (effect === 20) {
      // Heartbeat
      clearAllHwLeds();
      const hb = step % 16;
      if (hb === 0 || hb === 1) for (let i = 0; i < 8; i++) setHwLed(i, hex, 1);
      else if (hb === 4 || hb === 5) for (let i = 0; i < 8; i++) setHwLed(i, hex, 0.8);
    } else if (effect === 19) {
      // Strobe
      clearAllHwLeds();
      if ((step % 4) < 2) for (let i = 0; i < 8; i++) setHwLed(i, hex, 1);
    } else if (effect === 22) {
      // Fire
      clearAllHwLeds();
      const fCols = ["#ff3b30", "#ff9500", "#ffcc00", "#ffffff"];
      for (let i = 0; i < 8; i++) {
        if (Math.random() > 0.4) setHwLed(i, fCols[Math.floor(Math.random() * fCols.length)], 0.9);
      }
    } else if (effect === 23) {
      // Matrix
      clearAllHwLeds();
      const p = step % 8;
      setHwLed(p, "#00ff87", 1);
      if (p > 0) setHwLed(p - 1, "#00ff87", 0.4);
    } else if (effect === 16) {
      // Sparkle
      clearAllHwLeds();
      setHwLed(Math.floor(Math.random() * 8), hex, 1);
      setHwLed(Math.floor(Math.random() * 8), hex, 0.7);
    } else if (effect === 18) {
      // Symmetric burst
      clearAllHwLeds();
      const p = step % 4;
      setHwLed(3 - p, hex, 1);
      setHwLed(4 + p, hex, 1);
    } else if (effect === 17) {
      for (let i = 0; i < 8; i++) setHwLed(i, hex, 1);
    } else {
      clearAllHwLeds();
    }
  }, interval);
}

function startHardwareSimulator() {
  triggerSimAnimation(state.connect.effect, state.connect.color, state.connect.speed);
}

function log(msg) {
  const box = document.getElementById("logBox");
  const t = new Date().toLocaleTimeString();
  box.innerText += `\n[${t}] ${msg}`;
  box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById("logBox").innerText = "[Лог очищен]";
}

window.addEventListener("DOMContentLoaded", initInterface);
</script>
